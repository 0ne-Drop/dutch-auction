server:
  port: ${API_PORT:8080}
  shutdown: graceful          # 종료 신호를 받으면 처리 중인 요청을 마무리한 뒤 내려감 (EKS 무중단 배포)

spring:
  application:
    name: dutch-auction-api
  threads:
    virtual:
      enabled: true           # Java 21 가상 스레드: 오픈 순간 동시 요청·SSE 연결 처리
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dutch_auction}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  data:
    redis:
      # [로컬·docker-compose] 단일 Redis: REDIS_HOST, REDIS_PORT
      # [EKS] Redis Sentinel: 아래 환경 변수가 있으면 Sentinel 모드로 동작 (Helm 차트의 api-config, redis-secret 이 주입)
      #   SPRING_DATA_REDIS_SENTINEL_MASTER  감시 이름 (mymaster)
      #   SPRING_DATA_REDIS_SENTINEL_NODES   sentinel 주소 목록 (host:26379,host:26379,...)
      #   SPRING_DATA_REDIS_PASSWORD         Redis 비밀번호
      #   Sentinel 모드에서는 host/port 를 쓰지 않고 Sentinel 에게 현재 master 를 물어 접속한다.
      #   장애 조치로 master 가 바뀌면 다시 물어서 새 master 로 재연결한다.
      # url(REDIS_URL)은 쓰지 않는다: url 이 있으면 비밀번호를 url 에서만 읽어 SPRING_DATA_REDIS_PASSWORD 가 무시된다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}                  # 명령 응답 대기. 장애 조치 중 요청이 오래 매달리지 않게
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    async:
      request-timeout: 30m    # SSE 연결 최대 유지 시간 (끊기면 브라우저가 자동 재연결)

management:
  endpoints:
    web:
      exposure:
        # prometheus: EKS 의 Prometheus 가 15초마다 수집 (Ingress 는 /api 만 열어서 외부에는 노출되지 않음)
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # S03 응답 시간 분포: histogram_quantile 로 p95/p99 계산
      # 전체 히스토그램(버킷 약 70개)은 uri·status·Pod 수만큼 시계열이 늘어나서 구간만 지정
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s
        # S09 Redis 명령 지연 (Lettuce 관측 메트릭 lettuce_seconds{db_operation, error})
        lettuce: 1ms,2ms,5ms,10ms,50ms,100ms,500ms,2s
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Redis 는 넣지 않는다: Sentinel 장애 조치(약 10초) 동안 모든 Pod 가 동시에 '준비 안 됨'이 되어
          # ALB 가 타깃을 전부 빼면 서비스 전체가 멈춘다. Redis 상태는 /actuator/health 에서 계속 확인할 수 있다.
          include: readinessState,db

app:
  cookie-secure: ${COOKIE_SECURE:false}
  session-ttl-days: 7
  seed:
    enabled: ${SEED_ENABLED:false}         # true면 시작할 때 데모 데이터 생성 (기존 데이터 삭제)
    start-in-sec: ${SEED_START_IN:60}
