# 백엔드(Spring Boot) CI: 테스트 → 이미지 빌드 → ECR push
#
# 실행 조건: prod 브랜치에 push되고 backend/ 또는 shared/ 가 바뀌었을 때 (Actions 탭에서 수동 실행도 가능)
#
# 이미지 태그: <가장 최근 git 태그>.<실행 번호>  (태그가 없으면 0.0.0.<실행 번호>)
#   예) v1.2.0.37
#
# 저장소 Settings → Environments → production 에 등록할 값 (production은 prod 브랜치만 사용하도록 제한)
#   Secrets
#     CICD_AWS_ACCESS      : 배포 전용 IAM 사용자의 액세스 키 ID (루트 계정 키 사용 금지)
#     CICD_AWS_SECRET_ACCESS  : 같은 키의 비밀 액세스 키
#   Variables
#     AWS_REGION      : ECR 리전 (예: ap-northeast-2)
#     ECR_REPOSITORY  : ECR 저장소 이름 (예: dutch-auction-api)
# CI 테스트!
name: backend-ci

on:
  push:
    branches: [prod]
    paths:
      - "backend/**"
      - "shared/**"                         # 가격 계산 테스트가 shared/price-cases.csv를 읽음
      - ".github/workflows/build-api.yaml"
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에서 새 실행이 시작되면 이전 실행은 취소
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 테스트 ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle                     # Gradle 의존성 캐시

      - name: 테스트
        run: |
          chmod +x gradlew                  # Windows에서 커밋하면 실행 권한이 빠질 수 있음
          ./gradlew --no-daemon test

  # ── 2. 이미지 빌드 & ECR push ────────────────────────────
  build-push:
    needs: test                             # 테스트가 성공해야 실행
    runs-on: ubuntu-latest
    environment: production                 # prod 브랜치에서만 Secrets 사용 가능
    steps:
      - name: 코드 받기 (태그 포함)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # git describe로 최근 태그를 찾기 위해 전체 기록 받기

      - name: 이미지 태그 정하기
        id: tag
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          IMAGE_TAG="${VERSION_TAG}.${{ github.run_number }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "이미지 태그: ${IMAGE_TAG}"

      - name: AWS 접속 (액세스 키)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CICD_AWS_ACCESS }}
          aws-secret-access-key: ${{ secrets.CICD_AWS_SECRET_ACCESS }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64            # EKS x86 노드 기준 (Graviton이면 linux/arm64)
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha              # 이전 빌드 레이어 재사용
          cache-to: type=gha,mode=max

      - name: 결과 요약
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}"
          {
            echo "### 올린 이미지"
            echo "\`${IMAGE}\`"
            echo ""
            echo "배포할 때: \`cd k8s && kustomize edit set image dutch-auction-api=${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"