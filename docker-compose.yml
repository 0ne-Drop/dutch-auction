services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dutch_auction
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dutch_auction"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dutch_auction
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: warn
      # 데모용: 컨테이너가 뜰 때마다 데이터를 초기화하고 60초 뒤 시작하는 오늘의 경매를 만든다
      SEED_START_IN: "60"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
